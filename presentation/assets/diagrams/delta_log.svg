<g class="fragment fade-out" data-fragment-index="2"><g class="fragment" data-fragment-index="1"><path d="M95,280 l-9,14 h18 z" fill="#00E5A4"/><text x="95" y="312" font-size="13" fill="#00E5A4" text-anchor="middle" font-weight="700" >readers</text></g></g>
<g class="fragment fade-out" data-fragment-index="3"><g class="fragment" data-fragment-index="2"><path d="M290,280 l-9,14 h18 z" fill="#00E5A4"/><text x="290" y="312" font-size="13" fill="#00E5A4" text-anchor="middle" font-weight="700" >readers</text></g></g>
<g class="fragment fade-out" data-fragment-index="5"><g class="fragment" data-fragment-index="3"><path d="M485,280 l-9,14 h18 z" fill="#00E5A4"/><text x="485" y="312" font-size="13" fill="#00E5A4" text-anchor="middle" font-weight="700" >readers</text></g></g>
<g class="fragment" data-fragment-index="5"><path d="M290,280 l-9,14 h18 z" fill="#8950FF"/><text x="290" y="312" font-size="13" fill="#8950FF" text-anchor="middle" font-weight="700" >VERSION AS OF 1</text></g>
<g class="fragment fade-out" data-fragment-index="1"><text x="0" y="342" font-size="17" fill="#00E5A4" text-anchor="start" font-weight="700" >A Delta table</text><text x="0" y="366" font-size="16" fill="#FFFFFF" text-anchor="start" >A folder of Parquet files, plus a log of commits in _delta_log/.</text></g>
<g class="fragment fade-out" data-fragment-index="2"><g class="fragment" data-fragment-index="1"><text x="0" y="342" font-size="17" fill="#00E5A4" text-anchor="start" font-weight="700" >v0 · INSERT</text><text x="0" y="366" font-size="16" fill="#FFFFFF" text-anchor="start" >Write the Parquet files first, then commit one JSON file that lists them.</text></g></g>
<g class="fragment fade-out" data-fragment-index="3"><g class="fragment" data-fragment-index="2"><text x="0" y="342" font-size="17" fill="#00E5A4" text-anchor="start" font-weight="700" >v1 · INSERT</text><text x="0" y="366" font-size="16" fill="#FFFFFF" text-anchor="start" >Readers read the log, not the folder: the table is whatever the commits list.</text></g></g>
<g class="fragment fade-out" data-fragment-index="4"><g class="fragment" data-fragment-index="3"><text x="0" y="342" font-size="17" fill="#00E5A4" text-anchor="start" font-weight="700" >v2 · DELETE some rows of B</text><text x="0" y="366" font-size="16" fill="#FFFFFF" text-anchor="start" >Files are never edited: B is rewritten without them as B2. A and C are untouched.</text></g></g>
<g class="fragment fade-out" data-fragment-index="5"><g class="fragment" data-fragment-index="4"><text x="0" y="342" font-size="17" fill="#00E5A4" text-anchor="start" font-weight="700" >A writer crashes</text><text x="0" y="366" font-size="16" fill="#FFFFFF" text-anchor="start" >No commit, no change: readers never see D. A commit is all or nothing.</text></g></g>
<g class="fragment" data-fragment-index="5"><text x="0" y="342" font-size="17" fill="#00E5A4" text-anchor="start" font-weight="700" >Time travel · VERSION AS OF 1</text><text x="0" y="366" font-size="16" fill="#FFFFFF" text-anchor="start" >B is still on disk, so v1 reads back exactly - until VACUUM cleans it up.</text></g>
</svg>

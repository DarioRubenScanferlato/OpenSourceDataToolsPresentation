<!--
Delta Lake: a table is a folder of Parquet files plus a transaction log
(_delta_log/, one JSON file per commit). Five clicks: two inserts; a DELETE
that rewrites only the file holding the matching rows and logs "remove B, add
B2"; a writer that crashes before committing (nothing changes - atomicity);
and a time-travel read of v1, whose files are all still on disk. The mint
outline marks the files a reader sees at the pointer's version. Steps are
reveal.js fragments.
-->
<svg id="delta-log" viewBox="0 0 800 384" width="100%" xmlns="http://www.w3.org/2000/svg" style="display:block; font-family:inherit;">
<style>@keyframes delta-log-pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } } #delta-log .fragment.visible .pop { animation: delta-log-pop .45s ease-out both; }</style>
<text x="0" y="20" font-size="15" fill="#8F9AB8" text-anchor="start" style="font-family:var(--marimo-monospace-font, ui-monospace, SFMono-Regular, Menlo, monospace)" >s3://lake/readings/</text>
<text x="800" y="158" font-size="15" fill="#8F9AB8" text-anchor="start" font-weight="end" style="font-family:var(--marimo-monospace-font, ui-monospace, SFMono-Regular, Menlo, monospace)" >_delta_log/</text>

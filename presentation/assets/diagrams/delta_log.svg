<!--
Delta Lake: a table is a folder of Parquet files plus a transaction log
(_delta_log/, one JSON file per commit). The story, in five scenes: two
inserts, an update that writes a new file and logically removes the old one,
a writer that crashes before committing (so nothing changes - atomicity), and
a time-travel read of an older version, whose files are all still on disk.
The mint outline marks the files a reader sees at the pointer's version.
Inlined by template.assets.svg(); click the diagram to replay.
-->

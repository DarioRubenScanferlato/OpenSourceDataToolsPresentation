<g class="fragment" data-fragment-index="4"><rect x="650.0" y="32" width="60" height="88" rx="4" fill="#000E38" stroke="none" stroke-width="1.5" opacity="0.65"></rect></g>
<g class="fragment fade-out" data-fragment-index="5"><g class="fragment" data-fragment-index="3"><line x1="112" y1="102" x2="172" y2="32" stroke="#FF7A8A" stroke-width="3"/></g></g>
<g class="fragment" data-fragment-index="1"><g class="pop" style="animation-delay:0.70s"><path d="M95,168 C95,138 48,150 48,122" fill="none" stroke="#00E5A4" stroke-width="2" stroke-dasharray="4 4"/><path d="M95,168 C95,138 142,150 142,122" fill="none" stroke="#00E5A4" stroke-width="2" stroke-dasharray="4 4"/><rect x="7" y="168" width="176" height="72" rx="8" fill="#000E38" stroke="#8950FF" stroke-width="2" ></rect><text x="19" y="190" font-size="14" fill="#FFFFFF" text-anchor="start" font-weight="700" style="font-family:var(--marimo-monospace-font, ui-monospace, SFMono-Regular, Menlo, monospace)" >00000.json</text><text x="19" y="212" font-size="13" fill="#00E5A4" text-anchor="start" style="font-family:var(--marimo-monospace-font, ui-monospace, SFMono-Regular, Menlo, monospace)" >+ add A.parquet</text><text x="19" y="230" font-size="13" fill="#00E5A4" text-anchor="start" style="font-family:var(--marimo-monospace-font, ui-monospace, SFMono-Regular, Menlo, monospace)" >+ add B.parquet</text><circle cx="95" cy="268" r="7" fill="#8950FF"/><text x="95" y="255" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700" >v0</text></g></g>
<g class="fragment" data-fragment-index="2"><g class="pop" style="animation-delay:0.70s"><line x1="95" y1="268" x2="290" y2="268" stroke="#1E2A54" stroke-width="3"/><path d="M290,168 C290,138 290,150 290,122" fill="none" stroke="#00E5A4" stroke-width="2" stroke-dasharray="4 4"/><rect x="202" y="168" width="176" height="72" rx="8" fill="#000E38" stroke="#8950FF" stroke-width="2" ></rect><text x="214" y="190" font-size="14" fill="#FFFFFF" text-anchor="start" font-weight="700" style="font-family:var(--marimo-monospace-font, ui-monospace, SFMono-Regular, Menlo, monospace)" >00001.json</text><text x="214" y="212" font-size="13" fill="#00E5A4" text-anchor="start" style="font-family:var(--marimo-monospace-font, ui-monospace, SFMono-Regular, Menlo, monospace)" >+ add C.parquet</text><circle cx="290" cy="268" r="7" fill="#8950FF"/><text x="290" y="255" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700" >v1</text></g></g>
<g class="fragment" data-fragment-index="3"><g class="pop" style="animation-delay:0.70s"><line x1="290" y1="268" x2="485" y2="268" stroke="#1E2A54" stroke-width="3"/><path d="M485,168 C485,138 142,150 142,122" fill="none" stroke="#FF7A8A" stroke-width="2" stroke-dasharray="4 4"/><path d="M485,168 C485,138 485,150 485,122" fill="none" stroke="#00E5A4" stroke-width="2" stroke-dasharray="4 4"/><rect x="397" y="168" width="176" height="72" rx="8" fill="#000E38" stroke="#8950FF" stroke-width="2" ></rect><text x="409" y="190" font-size="14" fill="#FFFFFF" text-anchor="start" font-weight="700" style="font-family:var(--marimo-monospace-font, ui-monospace, SFMono-Regular, Menlo, monospace)" >00002.json</text><text x="409" y="212" font-size="13" fill="#FF7A8A" text-anchor="start" style="font-family:var(--marimo-monospace-font, ui-monospace, SFMono-Regular, Menlo, monospace)" >− remove B.parquet</text><text x="409" y="230" font-size="13" fill="#00E5A4" text-anchor="start" style="font-family:var(--marimo-monospace-font, ui-monospace, SFMono-Regular, Menlo, monospace)" >+ add B2.parquet</text><circle cx="485" cy="268" r="7" fill="#8950FF"/><text x="485" y="255" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700" >v2</text></g></g>

<!--
ClickHouse's MergeTree, in four clicks: every INSERT is written as a small,
sorted, compressed part; background merges combine parts into bigger ones;
more inserts arrive; and those merge again. Writes stay cheap, reads stay
fast. Steps are reveal.js fragments.
-->
<svg id="ch-merge" viewBox="0 0 400 340" width="100%" xmlns="http://www.w3.org/2000/svg" style="display:block; font-family:inherit;">
<style>@keyframes ch-merge-pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } } @keyframes ch-merge-fade { from { opacity: 0; } to { opacity: 1; } } @keyframes ch-merge-blip { 0% { opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { opacity: 0; } } #ch-merge .fragment.visible .pop { animation: ch-merge-pop .45s ease-out both; } #ch-merge .fragment.visible .fade { animation: ch-merge-fade .4s ease-out both; } #ch-merge .blip { opacity: 0; } #ch-merge .fragment.visible .blip { animation: ch-merge-blip 1s linear both; }</style>
<text x="0" y="18" font-size="12" fill="#8F9AB8" text-anchor="start" font-weight="600" letter-spacing="1.5">INSERT → small parts</text>
<text x="388" y="18" font-size="12" fill="#8F9AB8" text-anchor="end" font-weight="600" letter-spacing="0.5">merged in the background ↓</text>

<!--
Why WebAssembly matters for dashboards. Top: a classic server-side BI tool -
every filter click is a request to the server and a wait for the answer.
Bottom: the query engine itself is compiled to WebAssembly and downloaded
once with the data (Arrow); every click after that is answered inside the
browser tab, with no network at all. Same four clicks, same chart.
Inlined by template.assets.svg(); click the diagram to replay.
-->

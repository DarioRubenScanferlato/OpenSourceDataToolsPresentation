<!--
Why WebAssembly matters for dashboards, in two clicks. 1: a classic
server-side BI tool - every filter click is a request to the server and a wait
for the answer (looping). 2: the query engine itself compiled to WebAssembly,
downloaded once with the data (Arrow); every click after that is answered
inside the browser tab. Steps are reveal.js fragments; the loops are CSS.
-->
<svg id="wasm" viewBox="0 0 800 300" width="100%" xmlns="http://www.w3.org/2000/svg" style="display:block; font-family:inherit;">
<style>@keyframes wasm-pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } } @keyframes wasm-fade { from { opacity: 0; } to { opacity: 1; } } @keyframes wasm-blip { 0% { opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { opacity: 0; } } #wasm .fragment.visible .pop { animation: wasm-pop .45s ease-out both; } #wasm .fragment.visible .fade { animation: wasm-fade .4s ease-out both; } #wasm .blip { opacity: 0; } #wasm .fragment.visible .blip { animation: wasm-blip 1s linear both; } @keyframes wasm-trip { 0% { opacity: 1; transform: translateX(0); } 40% { transform: translateX(298px); } 80% { opacity: 1; transform: translateX(0); } 81%, 100% { opacity: 0; transform: translateX(0); } } @keyframes wasm-wait { 0%, 80% { opacity: 1; } 81%, 100% { opacity: 0; } } @keyframes wasm-local { 0% { opacity: 1; transform: translateX(0); } 22% { opacity: 1; transform: translateX(344px); } 23%, 100% { opacity: 0; transform: translateX(344px); } } @keyframes wasm-pulse { 0%, 12% { stroke: #FFFFFF; } 20%, 100% { stroke: #1E2A54; } } @keyframes wasm-down { 0% { opacity: 1; transform: translateX(0); } 88% { opacity: 1; transform: translateX(-270px); } 100% { opacity: 0; transform: translateX(-270px); } } #wasm .fragment.visible .trip { animation: wasm-trip 3.6s linear .4s infinite both; } #wasm .fragment.visible .wait { animation: wasm-wait 3.6s linear .4s infinite both; } #wasm .fragment.visible .slow-pulse { animation: wasm-pulse 3.6s linear .4s infinite; } #wasm .fragment.visible .local { animation: wasm-local 1.4s linear 2.4s infinite both; } #wasm .fragment.visible .fast-pulse { animation: wasm-pulse 1.4s linear 2.4s infinite; } #wasm .fragment.visible .down { animation: wasm-down 1.6s ease-in-out .3s both; } @keyframes wasm-bar-slow-0 { 0%, 40% { transform: scaleY(1.00); } 42%, 90% { transform: scaleY(0.40); } 92%, 100% { transform: scaleY(1.00); } } #wasm .fragment.visible .bar-slow-0 { animation: wasm-bar-slow-0 7.2s linear 0.4s infinite; } @keyframes wasm-bar-slow-1 { 0%, 40% { transform: scaleY(0.60); } 42%, 90% { transform: scaleY(1.00); } 92%, 100% { transform: scaleY(0.60); } } #wasm .fragment.visible .bar-slow-1 { animation: wasm-bar-slow-1 7.2s linear 0.4s infinite; } @keyframes wasm-bar-slow-2 { 0%, 40% { transform: scaleY(0.80); } 42%, 90% { transform: scaleY(0.53); } 92%, 100% { transform: scaleY(0.80); } } #wasm .fragment.visible .bar-slow-2 { animation: wasm-bar-slow-2 7.2s linear 0.4s infinite; } @keyframes wasm-bar-slow-3 { 0%, 40% { transform: scaleY(0.40); } 42%, 90% { transform: scaleY(0.73); } 92%, 100% { transform: scaleY(0.40); } } #wasm .fragment.visible .bar-slow-3 { animation: wasm-bar-slow-3 7.2s linear 0.4s infinite; } @keyframes wasm-bar-fast-0 { 0%, 11% { transform: scaleY(1.00); } 13%, 61% { transform: scaleY(0.40); } 63%, 100% { transform: scaleY(1.00); } } #wasm .fragment.visible .bar-fast-0 { animation: wasm-bar-fast-0 2.8s linear 2.4s infinite; } @keyframes wasm-bar-fast-1 { 0%, 11% { transform: scaleY(0.60); } 13%, 61% { transform: scaleY(1.00); } 63%, 100% { transform: scaleY(0.60); } } #wasm .fragment.visible .bar-fast-1 { animation: wasm-bar-fast-1 2.8s linear 2.4s infinite; } @keyframes wasm-bar-fast-2 { 0%, 11% { transform: scaleY(0.80); } 13%, 61% { transform: scaleY(0.53); } 63%, 100% { transform: scaleY(0.80); } } #wasm .fragment.visible .bar-fast-2 { animation: wasm-bar-fast-2 2.8s linear 2.4s infinite; } @keyframes wasm-bar-fast-3 { 0%, 11% { transform: scaleY(0.40); } 13%, 61% { transform: scaleY(0.73); } 63%, 100% { transform: scaleY(0.40); } } #wasm .fragment.visible .bar-fast-3 { animation: wasm-bar-fast-3 2.8s linear 2.4s infinite; } #wasm [class^='bar-'] { transform-box: fill-box; transform-origin: bottom; }</style>
<g class="fragment" data-fragment-index="1"><text x="0" y="14" font-size="12" fill="#8F9AB8" text-anchor="start" font-weight="700" letter-spacing="1.5">SERVER-SIDE BI</text><rect x="0" y="26" width="250" height="100" rx="10" fill="#0a1440" stroke="#1E2A54" stroke-width="1.5" ></rect><text x="14" y="46" font-size="13" fill="#8F9AB8" text-anchor="start" font-weight="600" >browser</text><rect class="slow-pulse" x="14" y="62" width="112" height="28" rx="14" fill="#000E38" stroke="#1E2A54" stroke-width="2"/><text x="70" y="81" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="600" >filter ▾</text><rect class="bar-slow-0" x="170" y="60" width="9" height="30" rx="2" fill="#00E5A4" style="transform: scaleY(1.00)"/><rect class="bar-slow-1" x="183" y="60" width="9" height="30" rx="2" fill="#00E5A4" style="transform: scaleY(0.60)"/><rect class="bar-slow-2" x="196" y="60" width="9" height="30" rx="2" fill="#00E5A4" style="transform: scaleY(0.80)"/><rect class="bar-slow-3" x="209" y="60" width="9" height="30" rx="2" fill="#00E5A4" style="transform: scaleY(0.40)"/><line x1="167" y1="91" x2="222" y2="91" stroke="#8F9AB8" stroke-width="1.5"/><rect x="560" y="26" width="240" height="100" rx="10" fill="#0a1440" stroke="#1E2A54" stroke-width="1.5" ></rect><text x="574" y="46" font-size="13" fill="#8F9AB8" text-anchor="start" font-weight="600" >server + database</text><g transform="translate(680,92)"><ellipse cy="-16" rx="22" ry="6" fill="#000E38" stroke="#DDCAFF" stroke-width="2"/><path d="M-22,-16 v28 a22,6 0 0 0 44,0 v-28" fill="#000E38" stroke="#DDCAFF" stroke-width="2"/></g><line x1="250" y1="76" x2="560" y2="76" stroke="#1E2A54" stroke-width="2" stroke-dasharray="4 5"/><circle class="trip" cx="256" cy="76" r="7" fill="#DDCAFF" style="opacity:0"/><g class="wait" style="opacity:0"><text x="132" y="114" font-size="13" fill="#FFC857" text-anchor="middle" font-weight="600" >waiting…</text></g><text x="405" y="104" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="600" >a network round trip, every click</text></g>
<g class="fragment" data-fragment-index="2"><text x="0" y="158" font-size="12" fill="#8F9AB8" text-anchor="start" font-weight="700" letter-spacing="1.5">IN THE BROWSER, WITH WEBASSEMBLY</text><rect x="0" y="170" width="560" height="112" rx="10" fill="#0a1440" stroke="#00E5A4" stroke-width="2" ></rect><text x="14" y="190" font-size="13" fill="#8F9AB8" text-anchor="start" font-weight="600" >browser</text><rect class="fast-pulse" x="14" y="210" width="112" height="28" rx="14" fill="#000E38" stroke="#1E2A54" stroke-width="2"/><text x="70" y="229" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="600" >filter ▾</text><rect class="bar-fast-0" x="474" y="208" width="9" height="30" rx="2" fill="#00E5A4" style="transform: scaleY(1.00)"/><rect class="bar-fast-1" x="487" y="208" width="9" height="30" rx="2" fill="#00E5A4" style="transform: scaleY(0.60)"/><rect class="bar-fast-2" x="500" y="208" width="9" height="30" rx="2" fill="#00E5A4" style="transform: scaleY(0.80)"/><rect class="bar-fast-3" x="513" y="208" width="9" height="30" rx="2" fill="#00E5A4" style="transform: scaleY(0.40)"/><line x1="471" y1="239" x2="526" y2="239" stroke="#8F9AB8" stroke-width="1.5"/><rect x="160" y="202" width="130" height="44" rx="8" fill="#000E38" stroke="#8950FF" stroke-width="2" ></rect><text x="225" y="222" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="700" style="font-family:var(--marimo-monospace-font, ui-monospace, SFMono-Regular, Menlo, monospace)" >engine.wasm</text><text x="225" y="238" font-size="11" fill="#8F9AB8" text-anchor="middle" >C++ / Rust, compiled</text><g class="pop" style="animation-delay:1.90s"><rect x="306" y="202" width="120" height="44" rx="8" fill="#000E38" stroke="#DDCAFF" stroke-width="2" ></rect><text x="366" y="222" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="700" style="font-family:var(--marimo-monospace-font, ui-monospace, SFMono-Regular, Menlo, monospace)" >data.arrow</text><text x="366" y="238" font-size="11" fill="#8F9AB8" text-anchor="middle" >columnar, in memory</text></g><rect x="600" y="170" width="200" height="112" rx="10" fill="#0a1440" stroke="#1E2A54" stroke-width="1.5" ></rect><text x="614" y="190" font-size="13" fill="#8F9AB8" text-anchor="start" font-weight="600" >static files / CDN</text><text x="700" y="232" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="600" >downloaded once</text><rect class="down" x="640" y="254" width="60" height="18" rx="9" fill="#DDCAFF" style="opacity:0"/><line x1="126" y1="262" x2="470" y2="262" stroke="#1E2A54" stroke-width="1.5" stroke-dasharray="3 4"/><circle class="local" cx="126" cy="262" r="6" fill="#00E5A4" style="opacity:0"/><g class="fade" style="animation-delay:2.40s"><text x="300" y="278" font-size="13" fill="#00E5A4" text-anchor="middle" font-weight="600" >answered locally, in milliseconds</text><text x="700" y="258" font-size="13" fill="#00E5A4" text-anchor="middle" font-weight="700" >round trips after that: 0</text></g></g>
</svg>

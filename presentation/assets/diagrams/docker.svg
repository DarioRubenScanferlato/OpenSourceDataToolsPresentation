<text x="14" y="62" font-size="12.5" style="font-family:var(--marimo-monospace-font, ui-monospace, SFMono-Regular, Menlo, monospace)"><tspan fill="#8950FF" font-weight="700">FROM</tspan><tspan fill="#FFFFFF" dx="7">python:3.14-slim</tspan></text>
<text x="14" y="96" font-size="12.5" style="font-family:var(--marimo-monospace-font, ui-monospace, SFMono-Regular, Menlo, monospace)"><tspan fill="#8950FF" font-weight="700">RUN</tspan><tspan fill="#FFFFFF" dx="7">pip install marimo</tspan></text>
<text x="14" y="130" font-size="12.5" style="font-family:var(--marimo-monospace-font, ui-monospace, SFMono-Regular, Menlo, monospace)"><tspan fill="#8950FF" font-weight="700">COPY</tspan><tspan fill="#FFFFFF" dx="7">app/ /app</tspan></text>
<text x="14" y="164" font-size="12.5" style="font-family:var(--marimo-monospace-font, ui-monospace, SFMono-Regular, Menlo, monospace)"><tspan fill="#8950FF" font-weight="700">CMD</tspan><tspan fill="#FFFFFF" dx="7">[&quot;marimo&quot;, &quot;run&quot;, …]</tspan></text>
<text x="98" y="224" font-size="12" fill="#8F9AB8" text-anchor="middle">a recipe, in plain text</text>

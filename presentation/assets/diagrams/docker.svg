<!--
Docker, for everyone, in two clicks. Before: an app needs more than its code
- the right Python, libraries, settings - on every machine it runs on. 1:
Docker packs all of it into one box, an image, like a shipping container.
2: the same box runs unchanged wherever Docker runs: a laptop, your own
servers, any cloud, a Kubernetes cluster. Steps are reveal.js fragments.
-->
<svg id="docker" viewBox="0 0 800 322" width="100%" xmlns="http://www.w3.org/2000/svg" style="display:block; font-family:inherit;">
<style>@keyframes docker-pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } } @keyframes docker-fade { from { opacity: 0; } to { opacity: 1; } } @keyframes docker-blip { 0% { opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { opacity: 0; } } #docker .fragment.visible .pop { animation: docker-pop .45s ease-out both; } #docker .fragment.visible .fade { animation: docker-fade .4s ease-out both; } #docker .blip { opacity: 0; } #docker .fragment.visible .blip { animation: docker-blip 1s linear both; }</style>
<g class="fragment semi-fade-out" data-fragment-index="1"><path d="M20,40 h34 l12,12 v44 h-46 z" fill="#0a1440" stroke="#00E5A4" stroke-width="2.2" stroke-linejoin="round"/><path d="M54,40 v12 h12" fill="none" stroke="#00E5A4" stroke-width="2.2" stroke-linejoin="round"/><text x="43.0" y="76.0" font-size="13" fill="#00E5A4" text-anchor="middle" font-weight="800" >app</text><text x="80" y="64" font-size="14" fill="#FFFFFF" text-anchor="start" font-weight="700" style="font-family:var(--marimo-monospace-font, ui-monospace, SFMono-Regular, Menlo, monospace)" >solar_dashboard.py</text><text x="80" y="84" font-size="13" fill="#8F9AB8" text-anchor="start" >...and what it needs:</text><rect x="20" y="116" width="196" height="28" rx="14" fill="#000E38" stroke="#1E2A54" stroke-width="1.5" ></rect><text x="36" y="135" font-size="13" fill="#DDCAFF" text-anchor="start" >Python 3.14</text><text x="206" y="135" font-size="15" fill="#FFC857" text-anchor="end" font-weight="800" >?</text><rect x="38" y="154" width="196" height="28" rx="14" fill="#000E38" stroke="#1E2A54" stroke-width="1.5" ></rect><text x="54" y="173" font-size="13" fill="#DDCAFF" text-anchor="start" >pandas · altair · marimo</text><text x="224" y="173" font-size="15" fill="#FFC857" text-anchor="end" font-weight="800" >?</text><rect x="20" y="192" width="196" height="28" rx="14" fill="#000E38" stroke="#1E2A54" stroke-width="1.5" ></rect><text x="36" y="211" font-size="13" fill="#DDCAFF" text-anchor="start" >settings and secrets</text><text x="206" y="211" font-size="15" fill="#FFC857" text-anchor="end" font-weight="800" >?</text><rect x="38" y="230" width="196" height="28" rx="14" fill="#000E38" stroke="#1E2A54" stroke-width="1.5" ></rect><text x="54" y="249" font-size="13" fill="#DDCAFF" text-anchor="start" >system libraries</text><text x="224" y="249" font-size="15" fill="#FFC857" text-anchor="end" font-weight="800" >?</text></g>

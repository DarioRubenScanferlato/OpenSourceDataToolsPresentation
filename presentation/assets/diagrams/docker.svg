<g class="fragment" data-fragment-index="3"><g class="pop"><line x1="620" y1="116" x2="643" y2="116" stroke="#8F9AB8" stroke-width="2"/><path d="M641,110 L650,116 L641,122 z" fill="#8F9AB8"/><text x="635.0" y="106" font-size="11" fill="#00E5A4" text-anchor="middle" font-weight="600" style="font-family:var(--marimo-monospace-font, ui-monospace, SFMono-Regular, Menlo, monospace)">run</text><text x="656" y="16" font-size="12" fill="#8F9AB8" text-anchor="start" font-weight="600">ANY MACHINE</text><rect x="656" y="28" width="140" height="176" rx="10" fill="#0a1440" stroke="#8F9AB8" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="666" y="42" width="120" height="42" rx="8" fill="#0a1440" stroke="#00E5A4" stroke-width="1.5"/><text x="726" y="60" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">container</text><text x="726" y="75" font-size="10" fill="#DDCAFF" text-anchor="middle" style="font-family:var(--marimo-monospace-font, ui-monospace, SFMono-Regular, Menlo, monospace)">my-dashboard:1.0</text><rect x="666" y="94" width="120" height="42" rx="8" fill="#0a1440" stroke="#00E5A4" stroke-width="1.5"/><text x="726" y="112" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">container</text><text x="726" y="127" font-size="10" fill="#DDCAFF" text-anchor="middle" style="font-family:var(--marimo-monospace-font, ui-monospace, SFMono-Regular, Menlo, monospace)">my-dashboard:1.0</text><rect x="666" y="148" width="120" height="42" rx="8" fill="#000E38" stroke="#1E2A54" stroke-width="1.5"/><text x="726" y="166" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="600">Docker Engine</text><text x="726" y="182" font-size="11" fill="#8F9AB8" text-anchor="middle">+ the host&#x27;s kernel</text><text x="726" y="224" font-size="12" fill="#8F9AB8" text-anchor="middle">isolated processes</text></g></g>
<g class="fragment fade-out" data-fragment-index="1"><text x="0" y="262" font-size="16" fill="#FFFFFF" text-anchor="start">A Dockerfile is the recipe: a base image, what the app needs, and how to start it.</text></g>
<g class="fragment fade-in-then-out" data-fragment-index="1"><text x="0" y="262" font-size="16" fill="#FFFFFF" text-anchor="start">docker build turns it into an image: read-only layers, so a rebuild only redoes what changed.</text></g>
<g class="fragment fade-in-then-out" data-fragment-index="2"><text x="0" y="262" font-size="16" fill="#FFFFFF" text-anchor="start">docker push stores the image in a registry, where any machine can pull it.</text></g>
<g class="fragment" data-fragment-index="3"><text x="0" y="262" font-size="16" fill="#FFFFFF" text-anchor="start">docker run starts containers: isolated processes on a shared kernel - lighter than VMs, start in seconds.</text></g>
</svg>

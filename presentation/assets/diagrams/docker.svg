="animation-delay:1.75s"><rect x="284" y="78" width="204" height="36" rx="6" fill="#00E5A4" stroke="#00E5A4" stroke-width="1.5" ></rect><text x="386.0" y="101" font-size="13" fill="#000E38" text-anchor="middle" font-weight="700" >solar_dashboard.py + settings</text></g></g></g>

<g class="fragment fade-out" data-fragment-index="1"><text x="0" y="304" font-size="16" fill="#FFFFFF" text-anchor="start" >To run, an app needs more than its code: the right Python, libraries and settings, on every machine.</text></g>
<g class="fragment fade-in-then-out" data-fragment-index="1"><text x="0" y="304" font-size="16" fill="#FFFFFF" text-anchor="start" >Docker packs the app and everything it needs into one box: an image, like a shipping container.</text></g>
<g class="fragment" data-fragment-index="2"><text x="0" y="304" font-size="16" fill="#FFFFFF" text-anchor="start" >The same box runs unchanged anywhere Docker runs - no more “but it works on my machine”.</text></g>
</svg>

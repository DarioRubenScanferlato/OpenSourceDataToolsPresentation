<!--
How Docker works, in three clicks. Before: a Dockerfile, the recipe. 1: docker
build turns it into an image of read-only, cached layers. 2: docker push stores
it in a registry. 3: docker run starts containers from it on any machine -
isolated processes sharing the host's kernel. Steps are reveal.js fragments.
Generated; colours are the deck's brand tokens.
-->
<svg id="docker" viewBox="0 0 800 276" width="100%" xmlns="http://www.w3.org/2000/svg" style="display:block; font-family:inherit;">

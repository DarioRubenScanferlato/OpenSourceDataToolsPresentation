<!--
Apache Iceberg: a table is a tree of metadata over Parquet files. The catalog
points at the current metadata file; it lists snapshots, each snapshot a
manifest list, each manifest a set of data files. A write builds a new branch
of the tree (sharing every unchanged file), then commits by swapping the
catalog's one pointer atomically. An old snapshot stays reachable from the new
metadata, which is what time travel follows. Mint marks what a reader sees.
Inlined by template.assets.svg(); click the diagram to replay.
-->

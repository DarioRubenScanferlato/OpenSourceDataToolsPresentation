<!--
Apache Iceberg: a table is a tree of metadata over Parquet files. Three
clicks: a write builds a new branch of the tree (sharing every unchanged
file); the commit swaps the catalog's one pointer atomically; time travel
follows the older snapshot that the new metadata still lists. Mint marks
what a reader sees. Steps are reveal.js fragments.
-->

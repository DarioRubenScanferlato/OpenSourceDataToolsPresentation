<!--
Authentication for an open-source platform, in four clicks. 1: the front door
(ingress + oauth2-proxy) sends anyone not logged in to the company's identity
provider - Keycloak, or Entra ID, Google, Okta - to log in once, with MFA. 2:
the proxy forwards each request with who you are and your groups; apps with
no login of their own (the marimo / JavaScript frontend) just read those headers. 3:
Superset and Airflow speak OIDC to the same provider: one login
everywhere. 4: groups become roles all the way down, to row-level security in
Postgres. Steps are reveal.js fragments.
-->
<svg id="auth" viewBox="0 0 800 346" width="100%" xmlns="http://www.w3.org/2000/svg" style="display:block; font-family:inherit;">
<style>@keyframes auth-pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } } @keyframes auth-fade { from { opacity: 0; } to { opacity: 1; } } @keyframes auth-blip { 0% { opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { opacity: 0; } } #auth .fragment.visible .pop { animation: auth-pop .45s ease-out both; } #auth .fragment.visible .fade { animation: auth-fade .4s ease-out both; } #auth .blip { opacity: 0; } #auth .fragment.visible .blip { animation: auth-blip 1s linear both; }</style>
<circle cx="34" cy="159" r="7" fill="none" stroke="#DDCAFF" stroke-width="2.2"/><path d="M21,182 a13,11 0 0 1 26,0" fill="none" stroke="#DDCAFF" stroke-width="2.2"/>
<text x="34" y="204" font-size="13" fill="#8F9AB8" text-anchor="middle" font-weight="600" >you</text>
<rect x="100" y="140" width="190" height="56" rx="10" fill="#0a1440" stroke="#00E5A4" stroke-width="2" ></rect><text x="112" y="161" font-size="14" fill="#FFFFFF" text-anchor="start" font-weight="700" >front door</text><text x="112" y="178" font-size="11.5" fill="#8F9AB8" text-anchor="start" >ingress + oauth2-proxy</text>
<path d="M60,166 L96,166" fill="none" stroke="#DDCAFF" stroke-width="2.2"/><path d="M88.0,159.0 L98.0,166.0 L88.0,173.0 z" fill="#DDCAFF"/>
<rect x="590" y="92" width="210" height="44" rx="10" fill="#0a1440" stroke="#00E5A4" stroke-width="2" ></rect><text x="602" y="113" font-size="13" fill="#FFFFFF" text-anchor="start" font-weight="700" >frontend</text><text x="602" y="130" font-size="11.5" fill="#8F9AB8" text-anchor="start" >marimo / JavaScript, no login</text>
<rect x="590" y="148" width="210" height="44" rx="10" fill="#0a1440" stroke="#166BFF" stroke-width="2" ></rect><text x="602" y="169" font-size="13" fill="#FFFFFF" text-anchor="start" font-weight="700" >Superset</text><text x="602" y="186" font-size="11.5" fill="#8F9AB8" text-anchor="start" >OIDC built in</text>
<rect x="590" y="204" width="210" height="44" rx="10" fill="#0a1440" stroke="#166BFF" stroke-width="2" ></rect><text x="602" y="225" font-size="13" fill="#FFFFFF" text-anchor="start" font-weight="700" >Airflow</text><text x="602" y="242" font-size="11.5" fill="#8F9AB8" text-anchor="start" >OIDC built in</text>
<g class="fragment" data-fragment-index="1"><g class="pop"><rect x="300" y="0" width="220" height="56" rx="10" fill="#0a1440" stroke="#8950FF" stroke-width="2" ></rect><text x="312" y="21" font-size="14" fill="#FFFFFF" text-anchor="start" font-weight="700" >identity provider</text><text x="312" y="38" font-size="11.5" fill="#8F9AB8" text-anchor="start" >Keycloak · or Entra ID, Google, Okta</text></g><g class="fade" style="animation-delay:0.40s"><path d="M180,140 C180,60 230,28 296,28" fill="none" stroke="#8950FF" stroke-width="2.2" stroke-dasharray="6 5"/><path d="M288.0,21.0 L298.0,28.0 L288.0,35.0 z" fill="#8950FF"/><text x="84" y="96" font-size="12" fill="#8950FF" text-anchor="start" font-weight="600" >not logged in?</text></g><g class="pop" style="animation-delay:1.00s"><rect x="420" y="62" width="100" height="22" rx="11" fill="#8950FF" stroke="none" stroke-width="1.5" ></rect><text x="470" y="77" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700" >log in + MFA</text></g></g>
<g class="fragment" data-fragment-index="2"><g class="fade"><path d="M340,56 C330,110 280,120 262,138" fill="none" stroke="#00E5A4" stroke-width="2.2"/><path d="M271.8,135.8 L260.0,139.0 L261.1,126.8 z" fill="#00E5A4"/><text x="310" y="104" font-size="12" fill="#00E5A4" text-anchor="start" font-weight="700" >token</text></g><g class="fade" style="animation-delay:0.80s"><path d="M290,160 C450,160 450,114 586,114" fill="none" stroke="#00E5A4" stroke-width="2.2"/><path d="M578.0,107.0 L588.0,114.0 L578.0,121.0 z" fill="#00E5A4"/><rect x="300" y="176" width="226" height="42" rx="6" fill="#000E38" stroke="#00E5A4" stroke-width="1.5" ></rect><text x="310" y="193" font-size="11" fill="#00E5A4" text-anchor="start" style="font-family:var(--marimo-monospace-font, ui-monospace, SFMono-Regular, Menlo, monospace)" >x-forwarded-email: ana@…</text><text x="310" y="209" font-size="11" fill="#00E5A4" text-anchor="start" style="font-family:var(--marimo-monospace-font, ui-monospace, SFMono-Regular, Menlo, monospace)" >x-forwarded-groups: plant-mgr</text></g></g>
<g class="fragment" data-fragment-index="3"><g class="fade" style="animation-delay:0.00s"><path d="M588,170 C560,170 562,22 524,22" fill="none" stroke="#166BFF" stroke-width="2.2" stroke-dasharray="6 5"/><path d="M532.0,29.0 L522.0,22.0 L532.0,15.0 z" fill="#166BFF"/></g><g class="fade" style="animation-delay:0.30s"><path d="M588,226 C560,226 562,30 524,30" fill="none" stroke="#166BFF" stroke-width="2.2" stroke-dasharray="6 5"/><path d="M532.0,37.0 L522.0,30.0 L532.0,23.0 z" fill="#166BFF"/></g><g class="fade" style="animation-delay:1.00s"><text x="695" y="66" font-size="12" fill="#166BFF" text-anchor="middle" font-weight="700" >one login everywhere (SSO)</text></g></g>
<g class="fragment" data-fragment-index="4"><g class="pop"><rect x="300" y="240" width="220" height="54" rx="10" fill="#0a1440" stroke="#DDCAFF" stroke-width="2" ></rect><text x="312" y="261" font-size="14" fill="#FFFFFF" text-anchor="start" font-weight="700" >Postgres</text><text x="312" y="278" font-size="11.5" fill="#8F9AB8" text-anchor="start" >roles · row-level security</text></g><g class="fade" style="animation-delay:0.50s"><path d="M695,250 C695,270 600,268 524,268" fill="none" stroke="#DDCAFF" stroke-width="2.2"/><path d="M532.0,275.0 L522.0,268.0 L532.0,261.0 z" fill="#DDCAFF"/><text x="560" y="290" font-size="12" fill="#DDCAFF" text-anchor="middle" font-weight="700" >groups → roles</text></g><g class="pop" style="animation-delay:1.00s"><rect x="100" y="240" width="190" height="54" rx="10" fill="#000E38" stroke="#00E5A4" stroke-width="1.5" ></rect><text x="112" y="261" font-size="13" fill="#FFFFFF" text-anchor="start" font-weight="700" >plant managers see</text><text x="112" y="280" font-size="13" fill="#00E5A4" text-anchor="start" font-weight="700" >only their own plants</text></g></g>
<g class="fragment fade-out" data-fragment-index="1"><text x="0" y="314" font-size="17" fill="#00E5A4" text-anchor="start" font-weight="700" >Many tools, many logins?</text><text x="0" y="338" font-size="16" fill="#FFFFFF" text-anchor="start" >Users hate it, IT can't audit it: every tool should use the company's one login.</text></g>
<g class="fragment fade-out" data-fragment-index="2"><g class="fragment" data-fragment-index="1"><text x="0" y="314" font-size="17" fill="#00E5A4" text-anchor="start" font-weight="700" >1 · Log in once</text><text x="0" y="338" font-size="16" fill="#FFFFFF" text-anchor="start" >The front door sends anyone not logged in to the company's identity provider.</text></g></g>
<g class="fragment fade-out" data-fragment-index="3"><g class="fragment" data-fragment-index="2"><text x="0" y="314" font-size="17" fill="#00E5A4" text-anchor="start" font-weight="700" >2 · Who you are travels with you</text><text x="0" y="338" font-size="16" fill="#FFFFFF" text-anchor="start" >The proxy adds your email and groups to every request - the frontend just reads them.</text></g></g>
<g class="fragment fade-out" data-fragment-index="4"><g class="fragment" data-fragment-index="3"><text x="0" y="314" font-size="17" fill="#00E5A4" text-anchor="start" font-weight="700" >3 · Same login everywhere</text><text x="0" y="338" font-size="16" fill="#FFFFFF" text-anchor="start" >Superset and Airflow speak OIDC to the same provider: single sign-on.</text></g></g>
<g class="fragment" data-fragment-index="4"><text x="0" y="314" font-size="17" fill="#00E5A4" text-anchor="start" font-weight="700" >4 · Roles all the way down</text><text x="0" y="338" font-size="16" fill="#FFFFFF" text-anchor="start" >Groups become app roles, then database roles and row-level security.</text></g>
</svg>

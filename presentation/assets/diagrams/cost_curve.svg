<!--
Total cost over time, illustrative only - the shape, not the numbers. A
managed platform has almost no set-up cost but charges for every query, user
and unit of capacity, so its line keeps steepening as adoption grows. An
open-source stack front-loads people and set-up time, then mostly costs
servers. Where the lines cross depends on your scale and your team.
Inlined by template.assets.svg(); click to replay.
-->

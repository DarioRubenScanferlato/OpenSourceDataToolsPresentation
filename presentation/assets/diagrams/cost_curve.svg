<!--
Total cost over time, illustrative only - the shape, not the numbers. Three
clicks: the managed platform's line (almost no set-up cost, but it charges for
every query, user and unit of capacity, so it keeps steepening), the
open-source stack's (people and set-up up front, then mostly servers), and
where they cross. Steps are reveal.js fragments.
-->
<svg id="cost" viewBox="0 0 400 300" width="100%" xmlns="http://www.w3.org/2000/svg" style="display:block; font-family:inherit;">
<style>@keyframes cost-pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } } @keyframes cost-fade { from { opacity: 0; } to { opacity: 1; } } @keyframes cost-blip { 0% { opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { opacity: 0; } } #cost .fragment.visible .pop { animation: cost-pop .45s ease-out both; } #cost .fragment.visible .fade { animation: cost-fade .4s ease-out both; } #cost .blip { opacity: 0; } #cost .fragment.visible .blip { animation: cost-blip 1s linear both; } @keyframes cost-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } } #cost .fragment.visible .draw { animation: cost-draw 2.2s ease-in-out both; }</style>
<line x1="30" y1="236" x2="392" y2="236" stroke="#8F9AB8" stroke-width="2"/>
<path d="M384.0,229.0 L394.0,236.0 L384.0,243.0 z" fill="#8F9AB8"/>
<line x1="30" y1="236" x2="30" y2="16" stroke="#8F9AB8" stroke-width="2"/>
<path d="M23.0,24.0 L30.0,14.0 L37.0,24.0 z" fill="#8F9AB8"/>
<text x="392" y="256" font-size="13" fill="#8F9AB8" text-anchor="end" font-weight="600" >time and usage →</text>
<text font-size="13" fill="#8F9AB8" font-weight="600" text-anchor="end" transform="translate(20,16) rotate(-90)">total cost →</text>
<text x="38" y="256" font-size="12" fill="#8F9AB8" text-anchor="start" font-style="italic">illustrative</text>
<g class="fragment" data-fragment-index="1"><path class="draw" d="M30,230 C190,196 290,106 382,22" fill="none" stroke="#166BFF" stroke-width="4" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/><g class="fade"><rect x="46" y="21" width="18" height="4" rx="2" fill="#166BFF"/><text x="72" y="30" font-size="15" fill="#166BFF" text-anchor="start" font-weight="700" >managed platform</text></g><g class="fade" style="animation-delay:1.60s"><text x="180" y="222" font-size="12" fill="#166BFF" text-anchor="start" font-weight="600" >pay per query, user, capacity</text></g></g>
<g class="fragment" data-fragment-index="2"><path class="draw" d="M30,166 L60,144 C150,121 270,106 382,86" fill="none" stroke="#00E5A4" stroke-width="4" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/><g class="fade"><rect x="46" y="43" width="18" height="4" rx="2" fill="#00E5A4"/><text x="72" y="52" font-size="15" fill="#00E5A4" text-anchor="start" font-weight="700" >open-source stack</text></g><g class="fade" style="animation-delay:1.60s"><text x="70" y="186" font-size="12" fill="#00E5A4" text-anchor="start" font-weight="600" >set-up + people</text></g></g>
<g class="fragment" data-fragment-index="3"><g class="pop"><circle cx="291" cy="101" r="8" fill="#000E38" stroke="#FFFFFF" stroke-width="2.5"/><text x="277" y="85" font-size="13" fill="#FFFFFF" text-anchor="end" font-weight="700" >break-even</text></g></g>
</svg>

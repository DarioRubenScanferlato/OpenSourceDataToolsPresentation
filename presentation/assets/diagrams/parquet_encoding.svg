<!--
Parquet, part 3: why the files are small, in three clicks. One column
(sensor_id) as plain strings, then dictionary-encoded (small integers), then
run-length encoded ((value, count) pairs), then compressed with a codec
(zstd, snappy). Steps are reveal.js fragments.
-->

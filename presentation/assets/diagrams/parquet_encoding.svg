<!--
Parquet, part 3: why the files are small. One column (sensor_id) goes through
the encodings Parquet applies per column: dictionary encoding turns repeated
strings into small integers, run-length encoding collapses repeats into
(value, count) pairs, and a general-purpose codec (zstd, snappy) squeezes the
page that's left. Inlined by template.assets.svg(); click the diagram to replay.
-->

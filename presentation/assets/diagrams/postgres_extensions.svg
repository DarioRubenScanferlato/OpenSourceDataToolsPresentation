<!--
PostgreSQL's superpower is extensions: the core stays a rock-solid
transactional row store, and extensions add new types, indexes and engines
in the same database. Each one lights up in turn. Logo from
../logos/postgresql.svg, embedded by template.assets.svg(); click to replay.
-->

<!--
Who usually goes for which: organisations placed by in-house engineering
capacity (x) and by data scale and organisational complexity (y). Four
clicks, one quadrant each. A map of tendencies, not rules. Steps are
reveal.js fragments.
-->
<svg id="who" viewBox="0 0 800 330" width="100%" xmlns="http://www.w3.org/2000/svg" style="display:block; font-family:inherit;">
<style>@keyframes who-pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } } @keyframes who-fade { from { opacity: 0; } to { opacity: 1; } } @keyframes who-blip { 0% { opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { opacity: 0; } } #who .fragment.visible .pop { animation: who-pop .45s ease-out both; } #who .fragment.visible .fade { animation: who-fade .4s ease-out both; } #who .blip { opacity: 0; } #who .fragment.visible .blip { animation: who-blip 1s linear both; }</style>
<line x1="40" y1="298" x2="800" y2="298" stroke="#8F9AB8" stroke-width="2"/>
<path d="M792.0,291.0 L802.0,298.0 L792.0,305.0 z" fill="#8F9AB8"/>
<line x1="40" y1="298" x2="40" y2="8" stroke="#8F9AB8" stroke-width="2"/>
<path d="M33.0,16.0 L40.0,6.0 L47.0,16.0 z" fill="#8F9AB8"/>
<line x1="420.0" y1="8" x2="420.0" y2="298" stroke="#1E2A54" stroke-width="1.5" stroke-dasharray="5 5"/>
<line x1="40" y1="153.0" x2="800" y2="153.0" stroke="#1E2A54" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="800" y="320" font-size="13" fill="#8F9AB8" text-anchor="end" font-weight="600" >in-house engineering capacity →</text>
<text font-size="13" fill="#8F9AB8" font-weight="600" text-anchor="end" transform="translate(26,8) rotate(-90)">data scale and organisational complexity →</text>
<g class="fragment" data-fragment-index="1"><g class="pop"><rect x="54" y="167.0" width="352.0" height="117.0" rx="12" fill="#0a1440" stroke="#DDCAFF" stroke-width="2.5" ></rect><rect x="70" y="167.0" width="320.0" height="4" rx="2" fill="#DDCAFF" stroke="none" stroke-width="1.5" ></rect><text x="70" y="195.0" font-size="18" fill="#FFFFFF" text-anchor="start" font-weight="700" >Keep it simple</text><text x="70" y="215.0" font-size="13" fill="#DDCAFF" text-anchor="start" font-weight="600" >Postgres or DuckDB + Metabase - or a SaaS BI tool</text></g><g class="fade" style="animation-delay:0.50s"><text x="70" y="241.0" font-size="14" fill="#00E5A4" text-anchor="start" font-weight="800" >_</text><text x="86" y="241.0" font-size="14" fill="#FFFFFF" text-anchor="start" >small businesses</text></g><g class="fade" style="animation-delay:0.85s"><text x="70" y="260.0" font-size="14" fill="#00E5A4" text-anchor="start" font-weight="800" >_</text><text x="86" y="260.0" font-size="14" fill="#FFFFFF" text-anchor="start" >a single analyst or two</text></g></g>
<g class="fragment" data-fragment-index="2"><g class="pop"><rect x="434.0" y="167.0" width="352.0" height="117.0" rx="12" fill="#0a1440" stroke="#00E5A4" stroke-width="2.5" ></rect><rect x="450.0" y="167.0" width="320.0" height="4" rx="2" fill="#00E5A4" stroke="none" stroke-width="1.5" ></rect><text x="450.0" y="195.0" font-size="18" fill="#FFFFFF" text-anchor="start" font-weight="700" >Open-source stack</text><text x="450.0" y="215.0" font-size="13" fill="#00E5A4" text-anchor="start" font-weight="600" >the tools in this talk, on a VM or Kubernetes</text></g><g class="fade" style="animation-delay:0.50s"><text x="450.0" y="241.0" font-size="14" fill="#00E5A4" text-anchor="start" font-weight="800" >_</text><text x="466.0" y="241.0" font-size="14" fill="#FFFFFF" text-anchor="start" >startups and scale-ups</text></g><g class="fade" style="animation-delay:0.85s"><text x="450.0" y="260.0" font-size="14" fill="#00E5A4" text-anchor="start" font-weight="800" >_</text><text x="466.0" y="260.0" font-size="14" fill="#FFFFFF" text-anchor="start" >public sector, academia</text></g><g class="fade" style="animation-delay:1.20s"><text x="450.0" y="279.0" font-size="14" fill="#00E5A4" text-anchor="start" font-weight="800" >_</text><text x="466.0" y="279.0" font-size="14" fill="#FFFFFF" text-anchor="start" >products embedding analytics</text></g></g>
<g class="fragment" data-fragment-index="3"><g class="pop"><rect x="54" y="22" width="352.0" height="117.0" rx="12" fill="#0a1440" stroke="#166BFF" stroke-width="2.5" ></rect><rect x="70" y="22" width="320.0" height="4" rx="2" fill="#166BFF" stroke="none" stroke-width="1.5" ></rect><text x="70" y="50" font-size="18" fill="#FFFFFF" text-anchor="start" font-weight="700" >Managed platform</text><text x="70" y="70" font-size="13" fill="#166BFF" text-anchor="start" font-weight="600" >Fabric, Databricks or Snowflake</text></g><g class="fade" style="animation-delay:0.50s"><text x="70" y="96" font-size="14" fill="#00E5A4" text-anchor="start" font-weight="800" >_</text><text x="86" y="96" font-size="14" fill="#FFFFFF" text-anchor="start" >enterprises on one cloud</text></g><g class="fade" style="animation-delay:0.85s"><text x="70" y="115" font-size="14" fill="#00E5A4" text-anchor="start" font-weight="800" >_</text><text x="86" y="115" font-size="14" fill="#FFFFFF" text-anchor="start" >regulated industries</text></g><g class="fade" style="animation-delay:1.20s"><text x="70" y="134" font-size="14" fill="#00E5A4" text-anchor="start" font-weight="800" >_</text><text x="86" y="134" font-size="14" fill="#FFFFFF" text-anchor="start" >teams without data engineers</text></g></g>
<g class="fragment" data-fragment-index="4"><g class="pop"><rect x="434.0" y="22" width="352.0" height="117.0" rx="12" fill="#0a1440" stroke="#8950FF" stroke-width="2.5" ></rect><rect x="450.0" y="22" width="320.0" height="4" rx="2" fill="#8950FF" stroke="none" stroke-width="1.5" ></rect><text x="450.0" y="50" font-size="18" fill="#FFFFFF" text-anchor="start" font-weight="700" >Hybrid - or build your own</text><text x="450.0" y="70" font-size="13" fill="#8950FF" text-anchor="start" font-weight="600" >managed compute on open formats (Iceberg, Delta)</text></g><g class="fade" style="animation-delay:0.50s"><text x="450.0" y="96" font-size="14" fill="#00E5A4" text-anchor="start" font-weight="800" >_</text><text x="466.0" y="96" font-size="14" fill="#FFFFFF" text-anchor="start" >large tech companies</text></g><g class="fade" style="animation-delay:0.85s"><text x="450.0" y="115" font-size="14" fill="#00E5A4" text-anchor="start" font-weight="800" >_</text><text x="466.0" y="115" font-size="14" fill="#FFFFFF" text-anchor="start" >where Airflow, Superset, Iceberg</text></g><g class="fade" style="animation-delay:1.20s"><text x="450.0" y="134" font-size="14" fill="#00E5A4" text-anchor="start" font-weight="800" >_</text><text x="466.0" y="134" font-size="14" fill="#FFFFFF" text-anchor="start" >and Trino were born</text></g></g>
</svg>

<!--
The solar data model. Bronze, one file per source system: the SCADA readings
name only their sensor; the sensor register says which plant each sensor is
in; plants is the asset register; the grid settlement is per plant and day.
Derived: reading_issues (one row per bad reading, found by the cleaning step)
and gold (one row per plant per day). Tables appear in the order the story
is told; N:1 marks each foreign key. Inlined by template.assets.svg();
click to replay.
-->

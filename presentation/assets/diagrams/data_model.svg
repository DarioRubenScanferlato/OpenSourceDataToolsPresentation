<!--
The solar data model, as a star schema. Fact tables (blue, FACT) record
events and measurements: the SCADA sensor readings, the grid operator's daily
settlement, and daily_plant_performance - one row per plant per day, the
table the dashboard is built on, aggregated from the readings and joined to
the settlement. Dimension tables (lavender, DIM) describe the things the facts
are about: sensors (which plant each sensor is in) and plants. N:1 marks each
foreign key. Static - inlined by template.assets.svg().
-->

<!--
Parquet, part 1: row-oriented vs column-oriented storage, in four clicks.
The same six sensor readings (time, sensor, kW) are laid out row by row
(CSV, Postgres), then column by column (Parquet). Averaging the power has to
read every value in the row layout, but only the kW block in the columnar
one. Each step is a reveal.js fragment: the presenter's next click/arrow
reveals it, and the motion inside it is CSS that starts when it appears.
-->
<svg id="pq-col" viewBox="0 0 800 312" width="100%" xmlns="http://www.w3.org/2000/svg" style="display:block; font-family:inherit;">
<style>@keyframes pq-col-pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } } @keyframes pq-col-fade { from { opacity: 0; } to { opacity: 1; } } #pq-col .fragment.visible .pop { animation: pq-col-pop .35s ease-out both; } #pq-col .fragment.visible .fade { animation: pq-col-fade .3s ease-out both; } @keyframes pq-col-sweep-row { 0% { opacity: 1; transform: translateX(0); } 96% { opacity: 1; transform: translateX(493px); } 100% { opacity: 0; transform: translateX(493px); } } #pq-col .fragment.visible .sweep-row { animation: pq-col-sweep-row 3.96s linear .3s both; } @keyframes pq-col-sweep-col { 0% { opacity: 1; transform: translateX(0); } 92% { opacity: 1; transform: translateX(145px); } 100% { opacity: 0; transform: translateX(145px); } } #pq-col .fragment.visible .sweep-col { animation: pq-col-sweep-col 1.32s linear .9s both; }</style>

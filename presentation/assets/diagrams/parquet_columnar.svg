<g class="fragment fade-out" data-fragment-index="1"><text x="0" y="296" font-size="16" fill="#FFFFFF" text-anchor="start" >Six sensor readings: when, which sensor, and how much power it produced.</text></g>
<g class="fragment fade-in-then-out" data-fragment-index="1"><text x="0" y="296" font-size="16" fill="#FFFFFF" text-anchor="start" >Row-oriented files (CSV, Postgres) store each reading whole, one after the other.</text></g>
<g class="fragment fade-in-then-out" data-fragment-index="2"><text x="0" y="296" font-size="16" fill="#FFFFFF" text-anchor="start" >To average the power, the reader must go through every value: 18 out of 18.</text></g>
<g class="fragment fade-in-then-out" data-fragment-index="3"><text x="0" y="296" font-size="16" fill="#FFFFFF" text-anchor="start" >Column-oriented files (Parquet) store all the values of one column together.</text></g>
<g class="fragment" data-fragment-index="4"><text x="0" y="296" font-size="16" fill="#FFFFFF" text-anchor="start" >Now it jumps straight to the power column: 6 out of 18. With 50 columns, 2%.</text></g>
</svg>

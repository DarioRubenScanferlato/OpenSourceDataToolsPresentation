<!--
What an orchestrator does, on the dashboard's own pipeline: a schedule starts
a run, tasks start as soon as their upstream tasks succeed (the three
extracts in parallel), a failing task is retried automatically instead of
paging someone, and the run ends with a refreshed dashboard. States: grey
scheduled, blue running, mint success, red failed. Inlined by
template.assets.svg(); click the diagram to replay.
-->

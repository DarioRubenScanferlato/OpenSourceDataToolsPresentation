<!--
What an orchestrator does, on the dashboard's own pipeline, in four clicks:
the schedule fires and the three extracts run in parallel; clean_readings
fails on a timeout and is retried automatically; build_gold and the dashboard
refresh run once their inputs are done; the run completes. States: grey
scheduled, blue running, mint success, red failed. Steps are reveal.js
fragments; the state changes inside a step are CSS.
-->
<svg id="orch" viewBox="0 0 800 300" width="100%" xmlns="http://www.w3.org/2000/svg" style="display:block; font-family:inherit;">
<style>@keyframes orch-pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } } @keyframes orch-fade { from { opacity: 0; } to { opacity: 1; } } @keyframes orch-blip { 0% { opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { opacity: 0; } } #orch .fragment.visible .pop { animation: orch-pop .45s ease-out both; } #orch .fragment.visible .fade { animation: orch-fade .4s ease-out both; } #orch .blip { opacity: 0; } #orch .fragment.visible .blip { animation: orch-blip 1s linear both; }</style>

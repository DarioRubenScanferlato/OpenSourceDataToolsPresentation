<text x="32" y="258" font-size="14.5" fill="#FFFFFF" text-anchor="start" >the app's database: many</text>
<text x="16" y="279" font-size="15" fill="#00E5A4" text-anchor="start" font-weight="800" ></text>
<text x="32" y="279" font-size="14.5" fill="#FFFFFF" text-anchor="start" >small reads and writes</text>

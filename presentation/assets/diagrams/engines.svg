<!--
Three engines, three shapes. DuckDB: no server at all - a library inside
your own Python process, querying files and DataFrames in place. Postgres:
a server that many application clients send small transactions to, storing
rows. ClickHouse: a columnar server that ingests a stream of events and
answers many dashboards at once. Each of the first two columns is drawn at
the other's x and shifted into place by its <g>. Logos are the projects'
own (../logos/), embedded by template.assets.svg(); the packets loop on
their own.
-->

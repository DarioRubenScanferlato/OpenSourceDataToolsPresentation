<!--
Two ways to transform data at scale. Spark: the driver turns one DataFrame
expression into tasks, one per partition, and executors on many machines run
them in parallel. dbt: every model is a SELECT; ref() between models is what
builds the dependency graph, and tests run as each model is built (dbt sends
the SQL to your warehouse - DuckDB, Postgres, Spark, Snowflake...).
Inlined by template.assets.svg(); click the diagram to replay the dbt build.
-->

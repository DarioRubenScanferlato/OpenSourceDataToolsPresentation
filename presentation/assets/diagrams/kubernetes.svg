FFFFF" text-anchor="start" font-weight="700" >Postgres</text><text x="299" y="177" font-size="10" fill="#8F9AB8" text-anchor="start" >+ volume</text></g><g class="pop" style="animation-delay:0.97s"><rect x="556" y="110" width="108" height="32" rx="7" fill="#000E38" stroke="#8950FF" stroke-width="2" ></rect><text x="564" y="125" font-size="11.5" fill="#FFFFFF" text-anchor="start" font-weight="700" >worker</text><text x="564" y="137" font-size="10" fill="#8F9AB8" text-anchor="start" >Airflow</text></g><g class="pop" style="animation-delay:1.09s"><rect x="672" y="110" width="108" height="32" rx="7" fill="#000E38" stroke="#FFC857" stroke-width="2" ></rect><text x="680" y="125" font-size="11.5" fill="#FFFFFF" text-anchor="start" font-weight="700" >MinIO (S3)</text><text x="680" y="137" font-size="10" fill="#8F9AB8" text-anchor="start" >Parquet, Iceberg</text></g><g class="pop" style="animation-delay:1.21s"><rect x="556" y="150" width="108" height="32" rx="7" fill="#000E38" stroke="#FF7A8A" stroke-width="2" ></rect><text x="564" y="165" font-size="11.5" fill="#FFFFFF" text-anchor="start" font-weight="700" >Keycloak</text><text x="564" y="177" font-size="10" fill="#8F9AB8" text-anchor="start" >login</text></g></g>
<g class="fragment" data-fragment-index="2"><g class="fade" style="animation-delay:0.10s"><rect x="275" y="74" width="250" height="176" rx="10" fill="#000E38" opacity="0.7"/><rect x="275" y="74" width="250" height="176" rx="10" fill="none" stroke="#FF7A8A" stroke-width="2.5" stroke-dasharray="6 5"></rect><text x="400.0" y="234" font-size="15" fill="#FF7A8A" text-anchor="middle" font-weight="700" >✗ machine 2 is down</text></g><g class="pop" style="animation-delay:1.20s"><rect x="142" y="150" width="108" height="32" rx="7" fill="#000E38" stroke="#00E5A4" stroke-width="2" ></rect><text x="150" y="165" font-size="11.5" fill="#FFFFFF" text-anchor="start" font-weight="700" >dashboard</text><text x="150" y="177" font-size="10" fill="#8F9AB8" text-anchor="start" >v1.4</text></g><g class="pop" style="animation-delay:1.60s"><rect x="672" y="150" width="108" height="32" rx="7" fill="#000E38" stroke="#8950FF" stroke-width="2" ></rect><text x="680" y="165" font-size="11.5" fill="#FFFFFF" text-anchor="start" font-weight="700" >worker</text><text x="680" y="177" font-size="10" fill="#8F9AB8" text-anchor="start" >Airflow</text></g><g class="pop" style="animation-delay:2.00s"><rect x="556" y="190" width="108" height="32" rx="7" fill="#000E38" stroke="#DDCAFF" stroke-width="2" ></rect><text x="564" y="205" font-size="11.5" fill="#FFFFFF" text-anchor="start" font-weight="700" >Postgres</text><text x="564" y="217" font-size="10" fill="#8F9AB8" text-anchor="start" >+ volume</text></g></g>
<g class="fragment" data-fragment-index="3"><g class="fade"><circle cx="44" cy="13" r="7" fill="none" stroke="#00E5A4" stroke-width="2.2"/><path d="M31,36 a13,11 0 0 1 26,0" fill="none" stroke="#00E5A4" stroke-width="2.2"/><circle cx="68" cy="13" r="7" fill="none" stroke="#00E5A4" stroke-width="2.2"/><path d="M55,36 a13,11 0 0 1 26,0" fill="none" stroke="#00E5A4" stroke-width="2.2"/><g class="pop" style="animation-delay:0.50s"><rect x="26" y="190" width="108" height="32" rx="7" fill="#000E38" stroke="#00E5A4" stroke-width="2" ></rect><text x="34" y="205" font-size="11.5" fill="#FFFFFF" text-anchor="start" font-weight="700" >dashboard</text><text x="34" y="217" font-size="10" fill="#8F9AB8" text-anchor="start" >v1.4</text></g><g class="pop" style="animation-delay:0.90s"><rect x="672" y="190" width="108" height="32" rx="7" fill="#000E38" stroke="#00E5A4" stroke-width="2" ></rect><text x="680" y="205" font-size="11.5" fill="#FFFFFF" text-anchor="start" font-weight="700" >dashboard</text><text x="680" y="217" font-size="10" fill="#8F9AB8" text-anchor="start" >v1.4</text></g></g></g>

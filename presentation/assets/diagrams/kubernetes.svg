<!--
Kubernetes, in four clicks, on the platform from this talk. A cluster is a
few machines (nodes) run as one. 1: you declare what should run - two
dashboards, Superset, Airflow, Postgres, object storage, Keycloak - and
Kubernetes places the containers. 2: a machine dies; its containers restart
on the others. 3: more users; the dashboard gets more copies. 4: a new
version rolls out one copy at a time. Steps are reveal.js fragments.
-->
<svg id="k8s" viewBox="0 0 800 360" width="100%" xmlns="http://www.w3.org/2000/svg" style="display:block; font-family:inherit;">
<style>@keyframes k8s-pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } } @keyframes k8s-fade { from { opacity: 0; } to { opacity: 1; } } @keyframes k8s-blip { 0% { opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { opacity: 0; } } #k8s .fragment.visible .pop { animation: k8s-pop .45s ease-out both; } #k8s .fragment.visible .fade { animation: k8s-fade .4s ease-out both; } #k8s .blip { opacity: 0; } #k8s .fragment.visible .blip { animation: k8s-blip 1s linear both; }</style>
<circle cx="20" cy="13" r="7" fill="none" stroke="#DDCAFF" stroke-width="2.2"/><path d="M7,36 a13,11 0 0 1 26,0" fill="none" stroke="#DDCAFF" stroke-width="2.2"/>
<text x="100" y="27" font-size="13" fill="#8F9AB8" text-anchor="start" font-weight="600" >users</text>
<rect x="140" y="6" width="520" height="32" rx="16" fill="#0a1440" stroke="#00E5A4" stroke-width="1.8" ></rect>
<text x="400" y="27" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="600" >ingress · the front door (HTTPS)</text>
<rect x="0" y="50" width="800" height="210" rx="12" fill="none" stroke="#8F9AB8" stroke-width="1.5" stroke-dasharray="6 5"></rect>
<text x="14" y="66" font-size="11" fill="#8F9AB8" text-anchor="start" font-weight="700" letter-spacing="1.5">KUBERNETES CLUSTER</text>
<rect x="10" y="74" width="250" height="176" rx="10" fill="#0a1440" stroke="#1E2A54" stroke-width="1.5" ></rect>
<text x="24" y="96" font-size="13" fill="#8F9AB8" text-anchor="start" font-weight="700" >machine 1</text>
<rect x="275" y="74" width="250" height="176" rx="10" fill="#0a1440" stroke="#1E2A54" stroke-width="1.5" ></rect>
<text x="289" y="96" font-size="13" fill="#8F9AB8" text-anchor="start" font-weight="700" >machine 2</text>
<rect x="540" y="74" width="250" height="176" rx="10" fill="#0a1440" stroke="#1E2A54" stroke-width="1.5" ></rect>
<text x="554" y="96" font-size="13" fill="#8F9AB8" text-anchor="start" font-weight="700" >machine 3</text>

<g class="fragment fade-out" data-fragment-index="1"><text x="0" y="296" font-size="17" fill="#00E5A4" text-anchor="start" font-weight="700" >A cluster</text><text x="0" y="320" font-size="16" fill="#FFFFFF" text-anchor="start" >A few machines that Kubernetes runs as one big computer for your containers.</text></g>
<g class="fragment fade-out" data-fragment-index="2"><g class="fragment" data-fragment-index="1"><text x="0" y="296" font-size="17" fill="#00E5A4" text-anchor="start" font-weight="700" >You declare, Kubernetes places</text><text x="0" y="320" font-size="16" fill="#FFFFFF" text-anchor="start" >“2 dashboards, Superset, Airflow, Postgres, storage, login” - spread over the machines.</text></g></g>
<g class="fragment fade-out" data-fragment-index="3"><g class="fragment" data-fragment-index="2"><text x="0" y="296" font-size="17" fill="#00E5A4" text-anchor="start" font-weight="700" >A machine dies</text><text x="0" y="320" font-size="16" fill="#FFFFFF" text-anchor="start" >Its containers restart on the others within seconds. Data lives on volumes, not in containers.</text></g></g>
<g class="fragment fade-out" data-fragment-index="4"><g class="fragment" data-fragment-index="3"><text x="0" y="296" font-size="17" fill="#00E5A4" text-anchor="start" font-weight="700" >More users</text><text x="0" y="320" font-size="16" fill="#FFFFFF" text-anchor="start" >Kubernetes adds dashboard copies - and removes them when the rush is over.</text></g></g>
<g class="fragment" data-fragment-index="4"><text x="0" y="296" font-size="17" fill="#00E5A4" text-anchor="start" font-weight="700" >A new version</text><text x="0" y="320" font-size="16" fill="#FFFFFF" text-anchor="start" >Copies are replaced one at a time: no downtime, and one command to roll back.</text></g>
</svg>

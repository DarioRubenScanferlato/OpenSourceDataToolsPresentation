<!--
Parquet, part 2: inside the file, in three clicks. Rows are cut into row
groups, each row group stores one chunk per column, and the footer keeps the
min/max of every chunk. To answer "average power since June 2026" a reader
(1) reads the footer, (2) skips the row groups whose time range can't match,
(3) reads just the kW chunk that's left. Steps are reveal.js fragments.
-->

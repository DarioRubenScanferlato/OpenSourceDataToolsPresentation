<!--
Parquet, part 2: inside the file. Rows are cut into row groups, each row group
stores one chunk per column, and the footer keeps min/max statistics for every
chunk. A filtered query reads the footer first, skips the row groups whose
range can't match, and then reads only the column chunks it needs.
Inlined by template.assets.svg(); click the diagram to replay.
-->

<!--
  How the solar dashboard is built, and how it ends up inside the deck:
  raw CSVs -> pandas -> Altair -> marimo, with marimo's reactivity looping
  back, and the dashboard notebook embedded into the presentation notebook.
  Inlined by template.assets.svg() so it inherits the deck's fonts and its
  arrows animate; the tool logos are the projects' own (../logos/), which
  assets.svg() embeds when inlining. Colours are the deck's brand tokens
  (template/theme.py).
-->
<svg viewBox="0 0 1000 420" width="100%" xmlns="http://www.w3.org/2000/svg" style="display:block; font-family:inherit;">

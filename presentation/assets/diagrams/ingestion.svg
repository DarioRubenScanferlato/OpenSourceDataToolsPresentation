<!--
Two open-source ways to land source data in the platform (extract-load).
Airbyte: a connector platform - pick a source and a destination from hundreds
of prebuilt connectors, it syncs them incrementally. dlt: ingestion as plain
Python - a library that turns any API response or generator into tables,
inferring the schema and unnesting JSON into child tables. Logos are the
projects' own (../logos/), embedded by template.assets.svg(); the packets loop.
-->

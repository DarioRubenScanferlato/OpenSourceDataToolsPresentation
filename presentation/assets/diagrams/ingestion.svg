<!--
Two ways to get at source data. Airbyte copies it (extract-load): connectors
read from databases, APIs and files and land it in the lake or warehouse,
incrementally. Trino leaves it where it is: one SQL query is split by the
coordinator and pushed to each source through its connector, and only the
results come back. Logos are the projects' own (../logos/), embedded by
template.assets.svg(); the packets loop on their own.
-->

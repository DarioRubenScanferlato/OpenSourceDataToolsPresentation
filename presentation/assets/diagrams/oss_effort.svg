<!--
The development effort behind an open-source data platform, as an iceberg.
Above the water, what people see: the tools, free to download. Below, two
clicks: what it takes to build a platform from them (deployment, CI/CD,
infrastructure, scaling) and to run it every day (monitoring and on-call,
SLAs, backups, security and upgrades). With open source, all of it is yours;
a managed platform does most of it for you. Steps are reveal.js fragments.
-->
<svg id="effort" viewBox="0 0 800 336" width="100%" xmlns="http://www.w3.org/2000/svg" style="display:block; font-family:inherit;">
<style>@keyframes effort-pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } } @keyframes effort-fade { from { opacity: 0; } to { opacity: 1; } } @keyframes effort-blip { 0% { opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { opacity: 0; } } #effort .fragment.visible .pop { animation: effort-pop .45s ease-out both; } #effort .fragment.visible .fade { animation: effort-fade .4s ease-out both; } #effort .blip { opacity: 0; } #effort .fragment.visible .blip { animation: effort-blip 1s linear both; }</style>
<rect x="0" y="104" width="800" height="196" fill="#06163f"/>
<path d="M0,104 q 25,-6 50,0 t 50,0 q 25,-6 50,0 t 50,0 q 25,-6 50,0 t 50,0 q 25,-6 50,0 t 50,0 q 25,-6 50,0 t 50,0 q 25,-6 50,0 t 50,0 q 25,-6 50,0 t 50,0 q 25,-6 50,0 t 50,0" fill="none" stroke="#166BFF" stroke-width="2" opacity="0.8"/>
<path d="M300,104 L345,40 L380,52 L410,10 L455,46 L500,104 Z" fill="#E8F0FF" stroke="#FFFFFF" stroke-width="2" opacity="0.95"/>
<image x="338" y="66" width="26" height="26" href="../logos/duckdb.svg"><title>DuckDB</title></image>
<image x="370" y="66" width="26" height="26" href="../logos/airflow.svg"><title>Airflow</title></image>
<image x="402" y="66" width="26" height="26" href="../logos/superset.svg"><title>Superset</title></image>
<image x="434" y="66" width="26" height="26" href="../logos/postgresql.svg"><title>Postgres</title></image>
<text x="520" y="46" font-size="13" fill="#8F9AB8" text-anchor="start" font-weight="600" >what people see:</text>
<text x="520" y="66" font-size="15" fill="#FFFFFF" text-anchor="start" font-weight="700" >the tools - free to download</text>
<g class="fragment" data-fragment-index="1"><g class="fade"><path d="M300,104 L150,150 L90,240 L150,300 L650,300 L720,220 L660,140 L500,104 Z" fill="#3a5f9e" opacity="0.35" stroke="#8fb4ff" stroke-width="1.5"/></g></g>
<g class="fragment" data-fragment-index="1"><g class="fade"><text x="160" y="132" font-size="12" fill="#00E5A4" text-anchor="start" font-weight="700" letter-spacing="1.5">TO BUILD IT</text></g><g class="pop" style="animation-delay:0.40s"><text x="160" y="160" font-size="15" fill="#FFFFFF" text-anchor="start" font-weight="700" >Deployment</text><text x="160" y="176" font-size="12" fill="#DDCAFF" text-anchor="start" >containers, Kubernetes, test and prod</text></g><g class="pop" style="animation-delay:0.75s"><text x="160" y="196" font-size="15" fill="#FFFFFF" text-anchor="start" font-weight="700" >CI/CD</text><text x="160" y="212" font-size="12" fill="#DDCAFF" text-anchor="start" >automated tests and releases</text></g><g class="pop" style="animation-delay:1.10s"><text x="160" y="232" font-size="15" fill="#FFFFFF" text-anchor="start" font-weight="700" >Infrastructure</text><text x="160" y="248" font-size="12" fill="#DDCAFF" text-anchor="start" >servers, network, storage - as code</text></g><g class="pop" style="animation-delay:1.45s"><text x="160" y="268" font-size="15" fill="#FFFFFF" text-anchor="start" font-weight="700" >Scaling</text><text x="160" y="284" font-size="12" fill="#DDCAFF" text-anchor="start" >capacity planning, autoscaling, tuning</text></g></g>
<g class="fragment" data-fragment-index="2"><g class="fade"><text x="440" y="132" font-size="12" fill="#00E5A4" text-anchor="start" font-weight="700" letter-spacing="1.5">TO RUN IT</text></g><g class="pop" style="animation-delay:0.40s"><text x="440" y="160" font-size="15" fill="#FFFFFF" text-anchor="start" font-weight="700" >Monitoring &amp; on-call</text><text x="440" y="176" font-size="12" fill="#DDCAFF" text-anchor="start" >someone answers the 3 am alert</text></g><g class="pop" style="animation-delay:0.75s"><text x="440" y="196" font-size="15" fill="#FFFFFF" text-anchor="start" font-weight="700" >SLAs</text><text x="440" y="212" font-size="12" fill="#DDCAFF" text-anchor="start" >uptime you now promise yourself</text></g><g class="pop" style="animation-delay:1.10s"><text x="440" y="232" font-size="15" fill="#FFFFFF" text-anchor="start" font-weight="700" >Backups &amp; recovery</text><text x="440" y="248" font-size="12" fill="#DDCAFF" text-anchor="start" >tested restores, disaster recovery</text></g><g class="pop" style="animation-delay:1.45s"><text x="440" y="268" font-size="15" fill="#FFFFFF" text-anchor="start" font-weight="700" >Security &amp; upgrades</text><text x="440" y="284" font-size="12" fill="#DDCAFF" text-anchor="start" >patches, CVEs, upgrading every tool</text></g></g>
<g class="fragment fade-out" data-fragment-index="1"><text x="0" y="326" font-size="16" fill="#FFFFFF" text-anchor="start" >Above the water, what people see: the tools. All free to download.</text></g>
<g class="fragment fade-in-then-out" data-fragment-index="1"><text x="0" y="326" font-size="16" fill="#FFFFFF" text-anchor="start" >Below the water, to build a platform: deployment, CI/CD, infrastructure, scaling.</text></g>
<g class="fragment" data-fragment-index="2"><text x="0" y="326" font-size="16" fill="#FFFFFF" text-anchor="start" >...and to run it, every day. With open source, all of this is yours to do.</text></g>
</svg>

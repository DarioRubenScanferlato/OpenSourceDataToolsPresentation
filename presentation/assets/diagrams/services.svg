<!--
More services, same idea, in two clicks. Before: Postgres, Airflow and Superset
ship official images; our dashboard is the image we built. 1: on one machine,
docker compose runs them all from one file. 2: on several machines, Kubernetes
runs the same images (Helm charts for the big tools). Steps are reveal.js
fragments. Generated; colours are the deck's brand tokens.
-->

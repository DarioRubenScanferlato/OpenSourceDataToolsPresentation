 y="124" width="148" height="122" rx="8" fill="#0a1440" stroke="#1E2A54" stroke-width="1.5"/><text x="652" y="140" font-size="10.5" fill="#8F9AB8" text-anchor="start">machine 3</text><rect x="650" y="148" width="132" height="28" rx="6" fill="#000E38" stroke="#8950FF" stroke-width="1.5"/><text x="716.0" y="166" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="600">Airflow worker</text><rect x="650" y="180" width="132" height="28" rx="6" fill="#000E38" stroke="#8950FF" stroke-width="1.5"/><text x="716.0" y="198" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="600">Airflow worker</text></g></g>
